name: Integración Continua

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean compile

      - name: Ejecutar pruebas unitarias y BDD
        run: mvn test

      - name: Generar reporte HTML de pruebas unitarias
        if: always()
        run: mvn site

      - name: Guardar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: |
            target/site/
            target/surefire-reports/

      - name: Guardar reporte BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-report.html